<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>业务影响分析与根因定位监控系统 — 阶段0骨架</title>
<style>
  :root {
    --bg:#0e1320; --bg2:#151c2c; --card:#1a2336; --card2:#212c42;
    --line:#2c3850; --line2:#3a4866;
    --txt:#e6edf6; --txt2:#97a3bb; --txt3:#6b7790;
    --red:#f0473e; --orange:#f79009; --yellow:#f5c518; --green:#1fb573; --blue:#3b8eff;
    --red-bg:rgba(240,71,62,.13); --orange-bg:rgba(247,144,9,.13);
    --green-bg:rgba(31,181,115,.13); --blue-bg:rgba(59,142,255,.13);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg); color:var(--txt); font-size:14px; line-height:1.6; }
  .mono { font-family:"SF Mono","Consolas","Menlo",monospace; }
  header { background:var(--bg2); border-bottom:1px solid var(--line); padding:0 24px;
    display:flex; align-items:center; gap:14px; height:56px; position:sticky; top:0; z-index:50; }
  .logo { font-weight:700; font-size:15px; }
  .logo .dot { color:var(--blue); }
  .skel-tag { background:var(--blue-bg); color:var(--blue); font-size:11px; font-weight:700;
    padding:2px 8px; border-radius:5px; }
  .clock { margin-left:auto; color:var(--txt2); font-size:13px; }
  .clock b { color:var(--txt); }
  main { max-width:1320px; margin:0 auto; padding:24px; }
  .view { display:none; }
  .view.active { display:block; }
  h2.page-title { font-size:19px; margin-bottom:4px; }
  .page-sub { color:var(--txt3); font-size:13px; margin-bottom:20px; }
  .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .stat .num { font-size:26px; font-weight:700; line-height:1.2; }
  .stat .lbl { color:var(--txt3); font-size:12px; margin-top:2px; }
  .stat.red .num { color:var(--red); }
  .stat.orange .num { color:var(--orange); }
  .stat.green .num { color:var(--green); }
  .section-head { display:flex; align-items:center; gap:10px; margin:4px 0 14px; }
  .section-head h3 { font-size:15px; }
  .section-head .count { color:var(--txt3); font-size:13px; }
  .cards { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .icard { background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; cursor:pointer; transition:.15s; position:relative; overflow:hidden; }
  .icard:hover { border-color:var(--blue); transform:translateY(-2px); }
  .icard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; }
  .icard.p1::before { background:var(--red); }
  .icard.p2::before { background:var(--orange); }
  .icard.p3::before { background:var(--yellow); }
  .icard-top { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:5px; letter-spacing:.5px; }
  .badge.p1 { background:var(--red); color:#fff; }
  .badge.p2 { background:var(--orange); color:#fff; }
  .badge.p3 { background:var(--yellow); color:#3a2c00; }
  .icard h4 { font-size:15px; }
  .dur { margin-left:auto; color:var(--txt3); font-size:12px; }
  .conclusion { background:var(--bg); border-radius:8px; padding:9px 11px; font-size:13px;
    color:var(--txt); margin:8px 0 10px; border-left:3px solid var(--blue); }
  .kv { display:flex; gap:8px; font-size:13px; margin-top:5px; }
  .kv .k { color:var(--txt3); white-space:nowrap; }
  .icard-foot { display:flex; align-items:center; gap:8px; margin-top:13px; }
  .btn { border:none; border-radius:7px; padding:7px 13px; font-size:13px; cursor:pointer;
    font-family:inherit; font-weight:500; }
  .btn-primary { background:var(--blue); color:#fff; }
  .btn-danger { background:var(--red); color:#fff; }
  .btn-ghost { background:var(--card2); color:var(--txt2); border:1px solid var(--line2); }
  .btn-sm { padding:5px 10px; font-size:12px; }
  .back { background:var(--card); border:1px solid var(--line2); color:var(--txt2);
    padding:7px 12px; border-radius:7px; cursor:pointer; font-size:13px; }
  .detail-bar { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .seg { background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:16px; overflow:hidden; }
  .seg-head { padding:12px 18px; border-bottom:1px solid var(--line); display:flex;
    align-items:center; gap:10px; background:var(--bg2); }
  .seg-num { width:22px; height:22px; border-radius:6px; background:var(--blue); color:#fff;
    font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .seg-head h3 { font-size:15px; }
  .seg-head .hint { color:var(--txt3); font-size:12px; margin-left:auto; }
  .seg-body { padding:18px; }
  .big-conclusion { background:linear-gradient(90deg,var(--red-bg),transparent);
    border:1px solid rgba(240,71,62,.3); border-radius:10px; padding:14px 16px;
    font-size:15px; margin-bottom:16px; display:flex; gap:10px; }
  .big-conclusion .ico { color:var(--red); font-size:18px; }
  .impact-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; }
  .panel-lbl { color:var(--txt3); font-size:12px; margin-bottom:8px;
    text-transform:uppercase; letter-spacing:.5px; }
  .health-row { display:flex; align-items:center; gap:10px; padding:8px 0;
    border-bottom:1px dashed var(--line); }
  .health-row:last-child { border:none; }
  .hdot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .hdot.red { background:var(--red); box-shadow:0 0 8px var(--red); }
  .hdot.yellow { background:var(--yellow); }
  .hdot.green { background:var(--green); }
  .health-row .name { font-weight:500; }
  .health-row .metric { margin-left:auto; color:var(--txt2); font-size:13px; }
  .stat-mini { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat-mini .box { background:var(--bg); border-radius:8px; padding:10px 12px; }
  .stat-mini .box .n { font-size:20px; font-weight:700; }
  .stat-mini .box .n.red { color:var(--red); }
  .stat-mini .box .l { color:var(--txt3); font-size:12px; }
  .tl-item { display:flex; gap:10px; font-size:13px; padding:3px 0; }
  .tl-item .t { color:var(--txt3); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tl-item .d { color:var(--txt2); }
  .tl-item.hot .d { color:var(--txt); }
  .chain { display:flex; align-items:center; margin:6px 0 18px; flex-wrap:wrap; }
  .chain-node { border:1.5px solid var(--line2); border-radius:9px; padding:10px 14px;
    text-align:center; min-width:104px; background:var(--bg); }
  .chain-node .nm { font-weight:600; font-size:13px; }
  .chain-node .st { font-size:11px; margin-top:2px; }
  .chain-node.ok { border-color:var(--green); } .chain-node.ok .st { color:var(--green); }
  .chain-node.bad { border-color:var(--red); background:var(--red-bg); }
  .chain-node.bad .nm { color:var(--red); } .chain-node.bad .st { color:var(--red); }
  .chain-node.warn { border-color:var(--yellow); } .chain-node.warn .st { color:var(--yellow); }
  .chain-arrow { color:var(--txt3); padding:0 8px; font-size:18px; }
  .drill { background:var(--bg); border-radius:9px; padding:6px 0; }
  .drill-row { display:flex; align-items:center; gap:9px; padding:8px 14px;
    border-left:3px solid transparent; }
  .drill-row.bad { border-left-color:var(--red); }
  .drill-row .lvl { color:var(--txt3); font-size:11px; background:var(--card2);
    padding:1px 6px; border-radius:4px; }
  .drill-row .obj { font-weight:500; }
  .drill-row.bad .obj { color:var(--red); }
  .drill-row .ev { margin-left:auto; }
  .drill-row .ev .pill { background:var(--red-bg); color:var(--red);
    padding:1px 7px; border-radius:4px; font-size:12px; }
  .rc { border:1px solid var(--line); border-radius:9px; padding:12px 14px; margin-bottom:10px; }
  .rc.top { border-color:rgba(240,71,62,.4); background:var(--red-bg); }
  .rc-head { display:flex; align-items:center; gap:10px; }
  .rc-rank { font-size:12px; font-weight:700; color:var(--txt3); }
  .rc-head .t { font-weight:600; }
  .conf { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .conf-bar { width:90px; height:6px; background:var(--card2); border-radius:3px; overflow:hidden; }
  .conf-bar i { display:block; height:100%; background:var(--red); }
  .conf-num { font-weight:700; font-size:13px; }
  .rc-ev { color:var(--txt2); font-size:13px; margin-top:7px; }
  .log-row { display:grid; grid-template-columns:auto 1fr auto auto; gap:12px;
    align-items:center; padding:9px 12px; border-radius:7px; font-size:13px; }
  .log-row + .log-row { border-top:1px solid var(--line); }
  .log-new { background:var(--red); color:#fff; font-size:10px; font-weight:700;
    padding:1px 6px; border-radius:4px; }
  .log-base { background:var(--card2); color:var(--txt3); font-size:10px;
    padding:1px 6px; border-radius:4px; }
  .log-cnt { color:var(--red); font-weight:700; }
  .log-cnt.base { color:var(--txt3); }
  .log-meta { color:var(--txt3); font-size:12px; white-space:nowrap; }
  .action { display:flex; align-items:center; gap:12px; padding:13px 14px;
    border:1px solid var(--line); border-radius:9px; margin-bottom:10px; }
  .action.reco { border-color:var(--blue); background:var(--blue-bg); }
  .action .info { flex:1; }
  .action .info .t { font-weight:600; }
  .action .info .t .reco-tag { background:var(--blue); color:#fff; font-size:10px;
    padding:1px 6px; border-radius:4px; margin-left:6px; font-weight:700; }
  .action .info .meta { color:var(--txt3); font-size:12px; margin-top:2px; }
  .risk { font-size:11px; padding:2px 8px; border-radius:5px; font-weight:600; }
  .risk.low { background:var(--green-bg); color:var(--green); }
  .risk.mid { background:var(--orange-bg); color:var(--orange); }
  .oplog { list-style:none; }
  .oplog li { display:flex; gap:12px; padding:6px 0; font-size:13px; position:relative;
    padding-left:18px; }
  .oplog li::before { content:""; position:absolute; left:3px; top:13px; width:7px;
    height:7px; border-radius:50%; background:var(--blue); }
  .oplog .t { color:var(--txt3); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .loading { color:var(--txt3); padding:40px; text-align:center; }
  .proto-note { margin-top:28px; background:var(--card); border:1px dashed var(--line2);
    border-radius:10px; padding:14px 18px; color:var(--txt3); font-size:12px; }
  .proto-note b { color:var(--txt2); }
</style>
</head>
<body>
<header>
  <div class="logo">业务影响分析与根因定位监控系统<span class="dot"> ●</span></div>
  <span class="skel-tag">阶段0骨架 · 数据来自实时异常检测</span>
  <div class="clock">值班：李工　<b id="clock">--:--:--</b></div>
</header>

<main>
  <section id="view-dashboard" class="view active">
    <h2 class="page-title">故障大盘</h2>
    <div class="page-sub">默认只呈现进行中的故障 · 由后端异常检测自动生成</div>
    <div class="summary" id="summary"></div>
    <div class="section-head"><h3>进行中故障</h3><span class="count" id="card-count"></span></div>
    <div class="cards" id="cards"><div class="loading">加载中 …</div></div>
  </section>

  <section id="view-detail" class="view">
    <div class="detail-bar">
      <button class="back" onclick="showDashboard()">← 返回大盘</button>
      <div id="detail-head" style="display:flex;align-items:center;gap:12px;flex:1"></div>
    </div>
    <div id="detail-body"><div class="loading">加载中 …</div></div>
  </section>

  <div class="proto-note">
    <b>阶段 0 端到端骨架：</b>样例业务指标 → 后端阈值异常检测 → 生成故障事件 → 本页展示。
    大盘上的故障级别、检测时间、持续时长由检测实时计算；根因/日志/处置为场景样例。
    数据接口：<span class="mono">/api/incidents</span>、<span class="mono">/api/incidents/{id}</span>。
  </div>
</main>

<script>
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const pcls = sev => sev.toLowerCase();

  async function loadDashboard() {
    const list = await fetch('/api/incidents').then(r => r.json());
    const p1 = list.filter(i => i.severity === 'P1').length;
    const p2 = list.filter(i => i.severity === 'P2').length;
    $('#summary').innerHTML = `
      <div class="stat ${list.length?'red':'green'}"><div class="num">${list.length}</div><div class="lbl">进行中故障</div></div>
      <div class="stat red"><div class="num">${p1}</div><div class="lbl">P1 严重</div></div>
      <div class="stat orange"><div class="num">${p2}</div><div class="lbl">P2 重要</div></div>
      <div class="stat green"><div class="num">1′</div><div class="lbl">本次发现耗时</div></div>`;
    $('#card-count').textContent = `共 ${list.length} 起`;
    if (!list.length) {
      $('#cards').innerHTML = '<div class="loading">当前无进行中故障</div>';
      return;
    }
    $('#cards').innerHTML = list.map(i => `
      <div class="icard ${pcls(i.severity)}" onclick="showDetail('${i.id}')">
        <div class="icard-top">
          <span class="badge ${pcls(i.severity)}">${i.severity}</span>
          <h4>${esc(i.title)}</h4>
          <span class="dur">已持续 ${i.duration_min} 分钟</span>
        </div>
        <div class="conclusion">${esc(i.conclusion)}</div>
        <div class="kv"><span class="k">影响业务：</span><span>${esc(i.business)}</span></div>
        <div class="kv"><span class="k">疑似根因：</span><span>${esc(i.root_cause)}</span></div>
        <div class="kv"><span class="k">建议动作：</span><span>${esc(i.suggested_action)}</span></div>
        <div class="icard-foot">
          <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();showDetail('${i.id}')">进入处置</button>
        </div>
      </div>`).join('');
  }

  async function showDetail(id) {
    $('#view-dashboard').classList.remove('active');
    $('#view-detail').classList.add('active');
    window.scrollTo(0, 0);
    $('#detail-body').innerHTML = '<div class="loading">加载中 …</div>';
    const inc = await fetch('/api/incidents/' + id).then(r => r.json());
    renderDetail(inc);
  }
  function showDashboard() {
    $('#view-detail').classList.remove('active');
    $('#view-dashboard').classList.add('active');
    window.scrollTo(0, 0);
  }

  function renderDetail(inc) {
    $('#detail-head').innerHTML =
      `<span class="badge ${pcls(inc.severity)}">${inc.severity}</span>
       <h2 class="page-title" style="margin:0">${esc(inc.title)}</h2>
       <span class="dur" style="margin-left:auto">事件号 ${inc.id} · 已持续 ${inc.duration_min} 分钟</span>`;

    const im = inc.impact, rc = inc.rootcause, rm = inc.remediation;
    const healthRow = h => `<div class="health-row"><span class="hdot ${h.health}"></span>
      <span class="name">${esc(h.name)}</span><span class="metric">${esc(h.metric)}</span></div>`;

    $('#detail-body').innerHTML = `
      <div class="big-conclusion"><span class="ico">●</span>
        <div><b>一句话结论：</b>${esc(inc.conclusion)}</div></div>

      <div class="seg">
        <div class="seg-head"><span class="seg-num">1</span><h3>业务影响摘要</h3>
          <span class="hint">回答：影响什么业务、有多严重</span></div>
        <div class="seg-body"><div class="impact-grid">
          <div>
            <div class="panel-lbl">受影响业务健康度</div>
            ${im.businesses.map(healthRow).join('')}
            <div class="panel-lbl" style="margin-top:16px">影响时间线</div>
            ${im.timeline.map(t => `<div class="tl-item ${t.hot?'hot':''}">
              <span class="t">${t.ts}</span><span class="d">${esc(t.text)}</span></div>`).join('')}
          </div>
          <div>
            <div class="panel-lbl">业务损失量化</div>
            <div class="stat-mini">
              <div class="box"><div class="n red">${inc.current_value}%</div><div class="l">当前业务成功率（检测实时值）</div></div>
              <div class="box"><div class="n red">${inc.duration_min} 分钟</div><div class="l">已受损时长</div></div>
              ${im.stats.map(s => `<div class="box"><div class="n ${s.danger?'red':''}">${esc(s.value)}</div><div class="l">${esc(s.label)}</div></div>`).join('')}
            </div>
            <div class="panel-lbl" style="margin-top:16px">技术 vs 业务成功率</div>
            ${im.tech_vs_biz.map(healthRow).join('')}
          </div>
        </div></div>
      </div>

      <div class="seg">
        <div class="seg-head"><span class="seg-num">2</span><h3>根因定位</h3>
          <span class="hint">先链路收敛 → 再逐层下钻 → 错误日志佐证</span></div>
        <div class="seg-body">
          <div class="panel-lbl">交易链路定位</div>
          <div class="chain">${rc.chain.map((n,idx) =>
            (idx?'<span class="chain-arrow">→</span>':'') +
            `<div class="chain-node ${n.status}"><div class="nm">${esc(n.name)}</div>
             <div class="st">● ${esc(n.note)}</div></div>`).join('')}</div>

          <div class="panel-lbl">逐层下钻</div>
          <div class="drill">${rc.drill.map(d => `<div class="drill-row ${d.status==='bad'?'bad':''}">
            <span style="width:${d.depth*22}px"></span>
            <span class="lvl">${esc(d.level)}</span>
            <span class="obj">${esc(d.object)}</span>
            <span class="ev"><span class="pill">${esc(d.evidence)}</span></span></div>`).join('')}</div>

          <div class="panel-lbl" style="margin-top:18px">根因候选 Top-${rc.candidates.length}</div>
          ${rc.candidates.map(c => `<div class="rc ${c.rank===1?'top':''}">
            <div class="rc-head"><span class="rc-rank">#${c.rank}</span>
              <span class="t">${esc(c.title)}</span>
              <span class="conf"><span class="conf-bar"><i style="width:${c.confidence}%"></i></span>
                <span class="conf-num" style="color:${c.confidence>50?'var(--red)':'var(--txt3)'}">${c.confidence}%</span></span></div>
            <div class="rc-ev">证据：${esc(c.evidence)}</div></div>`).join('')}

          <div class="panel-lbl" style="margin-top:18px">错误日志快速排查（基于 ES）</div>
          <div style="background:var(--bg);border-radius:9px;padding:6px">
            ${rc.logs.map(l => `<div class="log-row">
              <span class="log-${l.tag}">${l.tag==='new'?'新增':'基线内'}</span>
              <span class="mono">${esc(l.msg)}</span>
              <span class="log-cnt ${l.tag==='base'?'base':''}">${l.count.toLocaleString()}</span>
              <span class="log-meta">${esc(l.meta)}</span></div>`).join('')}
          </div>
          <div style="color:var(--txt3);font-size:12px;margin-top:8px">错误结论：${esc(rc.log_conclusion)}</div>
        </div>
      </div>

      <div class="seg">
        <div class="seg-head"><span class="seg-num">3</span><h3>应急处置建议</h3>
          <span class="hint">点击按钮可在平台内直接执行</span></div>
        <div class="seg-body">
          ${rm.actions.map(a => `<div class="action ${a.recommended?'reco':''}">
            <div class="info"><div class="t">${esc(a.title)}${a.recommended?'<span class="reco-tag">推荐</span>':''}</div>
              <div class="meta">${esc(a.desc)}</div></div>
            <span class="risk ${a.risk}">${a.risk==='low'?'低风险':'中风险'}</span>
            <button class="btn ${a.recommended?'btn-danger':'btn-ghost'}"
              onclick="alert('阶段0骨架：处置执行将在三期接入 TSF/作业平台。\\n动作：'+${JSON.stringify(a.title)})">${esc(a.button)}</button>
          </div>`).join('')}
          <div class="panel-lbl" style="margin-top:18px">处置时间线 / 协同记录</div>
          <ul class="oplog">${rm.oplog.map(o => `<li><span class="t">${o.ts}</span>
            <span>${esc(o.text)}</span></li>`).join('')}</ul>
        </div>
      </div>`;
  }

  function tick() {
    const d = new Date(), p = n => String(n).padStart(2,'0');
    $('#clock').textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }
  setInterval(tick, 1000); tick();
  loadDashboard();
</script>
